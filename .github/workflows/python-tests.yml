name: Python calculation tests

on:
  push:
    paths:
      - "tools/calculations/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "tools/calculations/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run calculation tests
        run: python -m unittest discover -s tools/calculations -p "test_*.py" -v
